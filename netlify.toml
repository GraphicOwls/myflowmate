[build]
  publish = "public/"
  command = "npm run build"
  ignore = "false"

[build.environment]
  NODE_VERSION = "16"
  NPM_VERSION = "8"
  NETLIFY_USE_JAMMY = "true"

[build.processing]
    skip_processing = false

[build.processing.css]
    bundle = false
    minify = false

[build.processing.js]
    bundle = false
    minify = false

[build.processing.html]
    pretty_urls = true

[build.processing.images]
    compress = true